name: Build Forge 1.20.1 Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Reconstruct backport patch
        shell: bash
        run: |
          cat patch/part-* | base64 -d > port.patch.xz
          echo "8c479127614fb74b7f389116547bfd9739d3729bd9170f97d7c1cb70ca9cfc48  port.patch.xz" | sha256sum -c -
          xz -dc port.patch.xz > port.patch
          echo "7f02c8e72ee5e608341803aa8b3f25e989565e241b3ebb4f683e9711e7412562  port.patch" | sha256sum -c -

      - name: Fetch upstream history
        run: git clone https://github.com/aszqb1125763/zifeng_s_custom_skill_tree-.git project

      - name: Recreate proven 1.20.1 Forge port on v1.2.9
        shell: bash
        run: |
          cd project
          git checkout b5c51231d56e1937d7e58b72d19e59cbeaedaada
          git switch -c forge-1.20.1-port
          patch --batch --forward -p4 < ../port.patch
          if compgen -G "../fixes/*.patch" > /dev/null; then
            for p in ../fixes/*.patch; do
              echo "Applying $p"
              patch --batch --forward -p1 < "$p"
            done
          fi
          git config user.name "Forge 1.20.1 Backport"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Forge 1.20.1 backport base"

      - name: Merge upstream v1.4.1 changes
        shell: bash
        run: |
          cd project
          set +e
          git merge origin/master --no-edit -X ours
          merge_rc=$?
          set -e
          if [ $merge_rc -ne 0 ]; then
            git rm -f --ignore-unmatch \
              src/main/java/org/zifeng/skilltree/jade/CreativeEnergyProvider.java \
              src/main/java/org/zifeng/skilltree/jade/SkillPointConverterProvider.java
            unresolved=$(git diff --name-only --diff-filter=U)
            if [ -n "$unresolved" ]; then
              echo "Unresolved conflicts remain:"
              echo "$unresolved"
              exit 1
            fi
            git add -A
            git commit --no-edit
          fi
          sed -i 's/^mod_version=.*/mod_version=1.4.1-1.20.1/' gradle.properties
          echo "Merged head: $(git rev-parse HEAD)"
          git status --short

      - name: Pack merged source snapshot
        shell: bash
        run: tar --exclude=.git --exclude=.gradle --exclude=build -czf merged-source-1.4.1.tar.gz -C project .

      - name: Upload merged source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: merged-source-1.4.1
          path: merged-source-1.4.1.tar.gz
          retention-days: 7

      - name: Show target configuration
        working-directory: project
        run: |
          java -version
          gradle --version
          grep -E '^(minecraft_version|forge_version|mod_version)=' gradle.properties

      - name: Build Forge mod
        working-directory: project
        run: gradle --no-daemon clean build --stacktrace

      - name: List build products
        if: always()
        working-directory: project
        run: find build -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Upload installable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zifeng-skilltree-1.20.1-forge-1.4.1
          path: project/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
